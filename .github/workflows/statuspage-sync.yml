# THE SELF-HEALING STATUS PAGE, layer A (Playbook docs/PLAN-self-healing-status-page-2026-10-01.md).
# After every Uptime CI run it turns Upptime's verdicts into what the public sees on
# https://status.predivo.ch: the service colours AND incidents - opened after 2 failed checks in a row,
# a fixed "still working on it" line after 60 silent minutes, monitoring on the first good check,
# resolved after 3. Subscribers are emailed on open and on close only (Roger, 2026-10-01).
# It is the only writer to Statuspage; it replaced the colour-only statuspage-sync.mjs.
# Runs on GitHub's own runners: no AI, nothing on our machines, so it works when they do not.
# The hourly schedule is a safety net if a workflow_run trigger is dropped.
# Not generated by Upptime: its update-template step only rewrites its own workflow files.
name: Statuspage sync
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Drill: run one labelled test incident end to end (emails off, deleted afterwards)"
        type: boolean
        default: false
permissions:
  contents: write # the incident state lives on the incident-state branch, written through the contents API
concurrency:
  group: statuspage-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the rules and the guard are tested before every run: an untested change never reaches the page
      - name: Rules and guard (offline tests)
        run: node --test test/*.test.mjs
      - name: Incidents and colours to Statuspage
        env:
          STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/incident-sync.mjs ${{ inputs.drill && '--drill' || '' }}
