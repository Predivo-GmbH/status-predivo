# Pushes Upptime's verdict to the public Atlassian Statuspage (https://predivo.statuspage.io).
# Runs right after every Uptime CI run; the hourly schedule is a safety net if a trigger is dropped.
# Not generated by Upptime: its update-template step only rewrites its own eight workflow files.
name: Statuspage sync
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: statuspage-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Push component status to Statuspage
        env:
          STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
        run: node scripts/statuspage-sync.mjs
