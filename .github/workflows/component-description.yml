# Sets the short description (hover text) of one service on https://predivo.statuspage.io.
# The Statuspage API key exists only as this repository's Actions secret, so the change is made here
# and the key never reaches a machine or a log. scripts/component-description.mjs refuses an email
# address, a key or an IP address (the text is public).
#   gh workflow run "Component description" -R Predivo-GmbH/status-predivo -f slug=email -f description="Our email server"
# The text reaches the script as an environment variable only - never pasted into a shell line.
# Not generated by Upptime: its update-template step only rewrites its own workflow files.
name: Component description
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Service"
        type: choice
        options: [website, client-portal, contact-form, client-portal-signin, email]
        default: email
      description:
        description: "Public hover text (plain words, no email address, <= 200 characters)"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: statuspage-write
  cancel-in-progress: false
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rules and guard (offline tests)
        run: node --test test/*.test.mjs
      - name: Set the description
        env:
          STATUSPAGE_API_KEY: ${{ secrets.STATUSPAGE_API_KEY }}
          SLUG: ${{ inputs.slug }}
          DESCRIPTION: ${{ inputs.description }}
        run: node scripts/component-description.mjs
