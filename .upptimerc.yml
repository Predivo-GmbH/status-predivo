# Status page for predivo.ch — https://status.predivo.ch
# Plan: C:\Business\Docs\PLAN-status-pages-2026-09-30.md (Predivo GmbH, 2026-09-30)
owner: Predivo-GmbH
repo: status-predivo
user-agent: Predivo-GmbH

sites:
  - name: Website (Deutsch)
    url: https://predivo.ch/de
    slug: website-de
    icon: https://predivo.ch/favicon-32x32.png
    maxResponseTime: 10000
    # a 200 from a host error or parking page is not our site
    __dangerous__body_down_if_text_missing: "Predivo"
  - name: Website (English)
    url: https://predivo.ch/en
    slug: website-en
    icon: https://predivo.ch/favicon-32x32.png
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "Predivo"
  - name: Client portal
    url: https://portal.predivo.ch
    slug: client-portal
    icon: https://predivo.ch/favicon-32x32.png
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "Project Portal"

  # LIVE PRODUCTS ONLY (fleet_portfolio, Roger 2026-09-14): ReplyFlow, SignalScore, ChannelMover.
  # Parked products (ScoutCopilot, Valrano, arivioo) and internal tools are deliberately not here.
  # "sign-in" = the product's Supabase auth service, asked with the product's PUBLIC anon key (the key
  # every visitor's browser already receives), kept as a repo secret so it is not copied into this file.
  - name: ReplyFlow website & app
    url: https://replyflow.help
    slug: replyflow-app
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "ReplyFlow"
  - name: ReplyFlow sign-in & accounts
    url: https://dqmhsdzldkxngwjrxois.supabase.co/auth/v1/health
    slug: replyflow-signin
    headers:
      - "apikey: $REPLYFLOW_SUPABASE_ANON"
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "GoTrue"
  - name: SignalScore website & app
    url: https://signalscore.ch
    slug: signalscore-app
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "SignalScore"
  - name: SignalScore sign-in & accounts
    url: https://ogdpgufptemcgyszmjek.supabase.co/auth/v1/health
    slug: signalscore-signin
    headers:
      - "apikey: $SIGNALSCORE_SUPABASE_ANON"
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "GoTrue"
  # The API is asked with a made-up customer key: its OWN refusal ("Missing or invalid API key")
  # proves the API code runs. The gateway's refusal (no project key) would only prove Supabase is up.
  - name: SignalScore API
    url: https://ogdpgufptemcgyszmjek.supabase.co/functions/v1/api-v1
    slug: signalscore-api
    headers:
      - "apikey: $SIGNALSCORE_SUPABASE_ANON"
      - "Authorization: Bearer $SIGNALSCORE_SUPABASE_ANON"
      - "x-api-key: status-probe-not-a-key"
    expectedStatusCodes:
      - 401
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "invalid API key"
  - name: ChannelMover website & app
    url: https://channelmover.com
    slug: channelmover-app
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "ChannelMover"
  - name: ChannelMover sign-in & accounts
    url: https://qswluvqunswggfmesdcs.supabase.co/auth/v1/health
    slug: channelmover-signin
    headers:
      - "apikey: $CHANNELMOVER_SUPABASE_ANON"
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "GoTrue"

# the repo-scoped workflow token cannot edit repository metadata; description + homepage were set once through the API
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  # status.predivo.ch is served by repo Predivo-GmbH/status-site (our own page, like status.claude.com).
  # This Upptime page lives at predivo-gmbh.github.io/status-predivo and forwards there.
  baseUrl: /status-predivo
  customHeadHtml: '<meta http-equiv="refresh" content="0; url=https://status.predivo.ch"><link rel="canonical" href="https://status.predivo.ch">'
  name: Predivo Status
  logoUrl: https://predivo.ch/favicon.svg
  favicon: https://predivo.ch/favicon-32x32.png
  faviconSvg: https://predivo.ch/favicon.svg
  theme: light
  introTitle: "**Status der Predivo-Dienste**"
  introMessage: "Hier sehen Sie live, ob predivo.ch, das Kundenportal und unsere Produkte ReplyFlow, SignalScore und ChannelMover erreichbar sind. Geprüft wird etwa alle fünf Minuten, von ausserhalb unserer eigenen Server. Störungen und geplante Wartungen erscheinen hier automatisch."
  navbar:
    - title: Status
      href: /
    - title: predivo.ch
      href: https://predivo.ch
    - title: Statusseite
      href: https://status.predivo.ch

