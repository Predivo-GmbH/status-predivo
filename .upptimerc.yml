# Status page for predivo.ch — https://status.predivo.ch
# Plan: C:\Business\Docs\PLAN-status-pages-2026-09-30.md (Predivo GmbH, 2026-09-30)
owner: Predivo-GmbH
repo: status-predivo
user-agent: Predivo-GmbH

sites:
  # ONE website (Roger 2026-10-01): the German and English pages are the same site and fail together.
  - name: Website
    url: https://predivo.ch/de
    slug: website
    icon: https://predivo.ch/favicon-32x32.png
    maxResponseTime: 10000
    # a 200 from a host error or parking page is not our site
    __dangerous__body_down_if_text_missing: "Predivo"
  - name: Client portal
    url: https://portal.predivo.ch
    slug: client-portal
    icon: https://predivo.ch/favicon-32x32.png
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "Project Portal"

  # Roger 2026-10-01 ("All three"): what clients rely on that the two page checks cannot see.
  # The contact form is asked with a plain GET: its script answers 405 "Method not allowed" - proof
  # that it runs, without sending a message (the mail itself is the Email check below).
  - name: Contact form
    url: https://predivo.ch/api/contact.php
    slug: contact-form
    expectedStatusCodes:
      - 405
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "Method not allowed"
  # The portal page can load while nobody can sign in: ask its sign-in service with the portal's
  # PUBLIC key (what every visitor's browser receives), kept as a repo secret.
  - name: Client portal sign-in
    url: https://xoecpzfsskalvjrtcbbl.supabase.co/auth/v1/health
    slug: client-portal-signin
    headers:
      - "apikey: $PORTAL_SUPABASE_ANON"
    maxResponseTime: 10000
    __dangerous__body_down_if_text_missing: "GoTrue"
  # The mail server for hello@predivo.ch. Port 465 (secure mail): port 25 is blocked for outgoing
  # connections on most networks, GitHub's runners included.
  - name: Email
    url: mail.predivo.ch
    slug: email
    check: tcp-ping
    port: 465

# the repo-scoped workflow token cannot edit repository metadata; description + homepage were set once through the API
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  # status.predivo.ch is served by repo Predivo-GmbH/status-site (our own page, like status.claude.com).
  # This Upptime page lives at predivo-gmbh.github.io/status-predivo and forwards there.
  baseUrl: /status-predivo
  customHeadHtml: '<meta http-equiv="refresh" content="0; url=https://status.predivo.ch"><link rel="canonical" href="https://status.predivo.ch">'
  name: Predivo Status
  logoUrl: https://predivo.ch/favicon.svg
  favicon: https://predivo.ch/favicon-32x32.png
  faviconSvg: https://predivo.ch/favicon.svg
  theme: light
  introTitle: "**Status der Predivo-Dienste**"
  introMessage: "Hier sehen Sie live, ob predivo.ch und das Kundenportal erreichbar sind. Geprüft wird etwa alle fünf Minuten, von ausserhalb unserer eigenen Server. Störungen und geplante Wartungen erscheinen hier automatisch."
  navbar:
    - title: Status
      href: /
    - title: predivo.ch
      href: https://predivo.ch
    - title: Statusseite
      href: https://status.predivo.ch

